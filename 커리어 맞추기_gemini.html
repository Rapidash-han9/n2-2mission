<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>축구선수 커리어 맞추기 퀴즈</title>
    <style>
        /* 기본 스타일 설정 */
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        #app-container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            min-height: 600px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 화면 공통 */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            flex-grow: 1;
        }
        .screen.active {
            display: flex;
        }

        /* 시작 화면 & 결과 화면 */
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p.desc {
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-primary {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #219150;
        }

        /* 퀴즈 화면 */
        #quiz-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #2980b9;
        }
        #career-box {
            background-color: #ecf0f1;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: left;
            box-sizing: border-box;
        }
        #career-box ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        #career-box li {
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px dashed #bdc3c7;
            padding-bottom: 5px;
        }
        #career-box li:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }
        .btn-option {
            background-color: white;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 15px 10px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        .btn-option:hover {
            background-color: #3498db;
            color: white;
        }

        /* 피드백(정답/오답) 화면 */
        #feedback-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 10;
        }
        #feedback-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .correct-text { color: #27ae60; }
        .wrong-text { color: #e74c3c; }
        #feedback-image {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            margin: 20px 0;
            border: 5px solid #ecf0f1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #feedback-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="screen active">
        <h1>축구선수 커리어 퀴즈</h1>
        <p class="desc">선수들의 연도별 소속팀 기록을 보고<br>누구인지 맞춰보세요!<br>(총 10문제)</p>
        <button class="btn-primary" onclick="startQuiz()">퀴즈 시작하기</button>
    </div>

    <!-- 2. 퀴즈 화면 -->
    <div id="quiz-screen" class="screen">
        <div id="quiz-header">
            <span id="question-number">1 / 10</span>
            <span id="current-score">점수: 0</span>
        </div>
        <div id="career-box">
            <ul id="career-list">
                <!-- 커리어 목록이 여기에 들어갑니다 -->
            </ul>
        </div>
        <div class="options-grid" id="options-container">
            <!-- 보기 버튼들이 여기에 들어갑니다 -->
        </div>
    </div>

    <!-- 3. 피드백(정답/오답) 화면 -->
    <div id="feedback-screen" class="screen">
        <div id="feedback-title">통과!</div>
        <img id="feedback-image" src="" alt="선수 사진">
        <div id="feedback-name">선수 이름</div>
        <button class="btn-primary" onclick="nextQuestion()">다음 문제</button>
    </div>

    <!-- 4. 최종 결과 화면 -->
    <div id="final-screen" class="screen">
        <h1>퀴즈 종료!</h1>
        <p class="desc" id="final-score-text">당신의 점수는 10점 만점에 0점입니다.</p>
        <button class="btn-primary" onclick="restartQuiz()">다시 풀기</button>
    </div>
</div>

<script>
    // 퀴즈 데이터 (10문제: 유명5, 알만함4, 어려움1)
    const quizData = [
        // --- [유명한 선수 5명] ---
        {
            name: "리오넬 메시",
            career: ["2004-2021: FC 바르셀로나", "2021-2023: 파리 생제르맹", "2023-현재: 인터 마이애미"],
            options: ["리오넬 메시", "크리스티아누 호날두", "네이마르", "루이스 수아레스"],
            image: "https://placehold.co/300x300/27ae60/ffffff?text=Messi"
        },
        {
            name: "크리스티아누 호날두",
            career: ["2002-2003: 스포르팅 CP", "2003-2009: 맨체스터 유나이티드", "2009-2018: 레알 마드리드", "2018-2021: 유벤투스", "2021-2022: 맨체스터 유나이티드", "2023-현재: 알 나스르"],
            options: ["가레스 베일", "카림 벤제마", "크리스티아누 호날두", "즐라탄 이브라히모비치"],
            image: "https://placehold.co/300x300/e74c3c/ffffff?text=Ronaldo"
        },
        {
            name: "손흥민",
            career: ["2010-2013: 함부르크 SV", "2013-2015: 바이어 레버쿠젠", "2015-현재: 토트넘 홋스퍼"],
            options: ["박지성", "손흥민", "이강인", "황희찬"],
            image: "https://placehold.co/300x300/3498db/ffffff?text=Son"
        },
        {
            name: "케빈 더 브라위너",
            career: ["2008-2012: 헹크", "2012-2014: 첼시", "2012-2013: 베르더 브레멘 (임대)", "2014-2015: 볼프스부르크", "2015-현재: 맨체스터 시티"],
            options: ["에덴 아자르", "토니 크로스", "루카 모드리치", "케빈 더 브라위너"],
            image: "https://placehold.co/300x300/9b59b6/ffffff?text=De+Bruyne"
        },
        {
            name: "즐라탄 이브라히모비치",
            career: ["1999-2001: 말뫼", "2001-2004: 아약스", "2004-2006: 유벤투스", "2006-2009: 인터밀란", "2009-2011: 바르셀로나", "2012-2016: 파리 생제르맹", "2016-2018: 맨유", "2020-2023: AC 밀란"],
            options: ["로베르트 레반도프스키", "즐라탄 이브라히모비치", "에딘손 카바니", "루이스 수아레스"],
            image: "https://placehold.co/300x300/f1c40f/333333?text=Zlatan"
        },
        // --- [알만한 선수 4명] ---
        {
            name: "박지성",
            career: ["2000-2003: 교토 퍼플 상가", "2003-2005: PSV 에인트호번", "2005-2012: 맨체스터 유나이티드", "2012-2014: QPR", "2013-2014: PSV 에인트호번 (임대)"],
            options: ["기성용", "이영표", "박지성", "차두리"],
            image: "https://placehold.co/300x300/e67e22/ffffff?text=Park"
        },
        {
            name: "앙헬 디 마리아",
            career: ["2005-2007: 로사리오 센트랄", "2007-2010: 벤피카", "2010-2014: 레알 마드리드", "2014-2015: 맨체스터 유나이티드", "2015-2022: 파리 생제르맹", "2022-2023: 유벤투스", "2023-현재: 벤피카"],
            options: ["앙헬 디 마리아", "파울로 디발라", "곤살로 이과인", "하비에르 마스체라노"],
            image: "https://placehold.co/300x300/1abc9c/ffffff?text=Di+Maria"
        },
        {
            name: "세스크 파브레가스",
            career: ["2003-2011: 아스널", "2011-2014: 바르셀로나", "2014-2019: 첼시", "2019-2022: AS 모나코", "2022-2023: 코모 1907"],
            options: ["사비 에르난데스", "안드레스 이니에스타", "다비드 실바", "세스크 파브레가스"],
            image: "https://placehold.co/300x300/34495e/ffffff?text=Fabregas"
        },
        {
            name: "페페",
            career: ["2001-2004: 마리티무", "2004-2007: FC 포르투", "2007-2017: 레알 마드리드", "2017-2018: 베식타스", "2019-2024: FC 포르투"],
            options: ["세르히오 라모스", "페페", "티아고 실바", "조르조 키엘리니"],
            image: "https://placehold.co/300x300/7f8c8d/ffffff?text=Pepe"
        },
        // --- [어려운 선수 1명 (저니맨)] ---
        {
            name: "니콜라 아넬카",
            career: ["1996-1997: 파리 생제르맹", "1997-1999: 아스널", "1999-2000: 레알 마드리드", "2000-2002: 파리 생제르맹", "2002-2005: 맨체스터 시티", "2006-2008: 볼턴 원더러스", "2008-2012: 첼시", "2012-2013: 상하이 선화", "2013: 유벤투스"],
            options: ["티에리 앙리", "올리비에 지루", "니콜라 아넬카", "사미르 나스리"],
            image: "https://placehold.co/300x300/2c3e50/ffffff?text=Anelka"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    // 화면 전환 함수
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }

    // 퀴즈 시작
    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        loadQuestion();
        showScreen('quiz-screen');
    }

    // 문제 불러오기
    function loadQuestion() {
        const currentData = quizData[currentQuestionIndex];
        
        // 헤더 업데이트
        document.getElementById('question-number').innerText = `${currentQuestionIndex + 1} / ${quizData.length}`;
        document.getElementById('current-score').innerText = `점수: ${score}`;

        // 커리어 목록 업데이트
        const careerList = document.getElementById('career-list');
        careerList.innerHTML = '';
        currentData.career.forEach(item => {
            const li = document.createElement('li');
            li.innerText = item;
            careerList.appendChild(li);
        });

        // 보기 버튼 업데이트 (항상 섞어서 출력)
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        // 보기 배열 복사 후 섞기 (Fisher-Yates Shuffle)
        let shuffledOptions = [...currentData.options];
        for (let i = shuffledOptions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
        }

        shuffledOptions.forEach(option => {
            const button = document.createElement('button');
            button.className = 'btn-option';
            button.innerText = option;
            button.onclick = () => checkAnswer(option);
            optionsContainer.appendChild(button);
        });
    }

    // 정답 확인
    function checkAnswer(selectedOption) {
        const currentData = quizData[currentQuestionIndex];
        const isCorrect = (selectedOption === currentData.name);
        
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackImage = document.getElementById('feedback-image');
        const feedbackName = document.getElementById('feedback-name');

        if (isCorrect) {
            score++;
            feedbackTitle.innerText = "통과! 🎉";
            feedbackTitle.className = "correct-text";
        } else {
            feedbackTitle.innerText = "땡! ❌";
            feedbackTitle.className = "wrong-text";
        }

        // 정답 선수 정보 보여주기
        feedbackImage.src = currentData.image;
        feedbackName.innerText = `정답: ${currentData.name}`;

        showScreen('feedback-screen');
    }

    // 다음 문제로 이동
    function nextQuestion() {
        currentQuestionIndex++;
        
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
            showScreen('quiz-screen');
        } else {
            // 모든 문제를 다 풀었을 때
            document.getElementById('final-score-text').innerText = `당신의 점수는 ${quizData.length}점 만점에 ${score}점입니다.`;
            showScreen('final-screen');
        }
    }

    // 다시 시작
    function restartQuiz() {
        startQuiz();
    }
</script>

</body>
</html>
